name: contract

on:
  push:
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    env:
      PACT_BROKER_URL: ${{ secrets.PACT_BROKER_URL }}
      PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
      CONSUMER_VERSION: ${{ github.sha }}
      PROVIDER_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Broker
        run: docker compose up -d --wait pact-broker broker-db

      - name: Default local broker when the secret is empty
        run: |
          if [ -z "$PACT_BROKER_URL" ]; then
            echo "PACT_BROKER_URL=http://127.0.0.1:21620" >> "$GITHUB_ENV"
          fi

      - name: Consumer contract
        run: npm run test:contract

      - name: Publish contract
        run: |
          code=$(curl -sS -o /tmp/pact-publish.json -w '%{http_code}' \
            -X PUT "$PACT_BROKER_URL/pacts/provider/marketplace-api/consumer/web-app/version/${CONSUMER_VERSION}" \
            -H 'Content-Type: application/json' \
            -d @pacts/web-app-marketplace-api.json)
          echo "publish HTTP $code"
          test "$code" = "201" || test "$code" = "200"

      - name: Verify provider
        run: npm run verify:provider

      # Ask whether this consumer SHA is verified against this provider SHA.
      # `to=prod` is the promotion question (local drill in README); answering
      # it here would require tagging this SHA as prod first, which makes the
      # gate always green.
      - name: can-i-deploy
        run: |
          body=$(curl -sS -G "$PACT_BROKER_URL/matrix" \
            --data-urlencode "q[][pacticipant]=web-app" \
            --data-urlencode "q[][version]=${CONSUMER_VERSION}" \
            --data-urlencode "q[][pacticipant]=marketplace-api" \
            --data-urlencode "q[][version]=${PROVIDER_VERSION}")
          echo "$body"
          echo "$body" | python3 -c "import json,sys; s=json.load(sys.stdin)['summary']; print(s); raise SystemExit(0 if s.get('deployable') is True else 1)"
