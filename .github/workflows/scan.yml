name: image-scan

on:
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build bait and image
        run: |
          printf 'dummy-npm-token' > .npm_token
          npm run image:build

      - name: Scan with the working threshold
        run: SCAN_MAX=200 npm run scan
