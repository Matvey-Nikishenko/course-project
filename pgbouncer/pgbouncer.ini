[databases]
marketplace = host=db port=5432 dbname=marketplace

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /tmp/userlist.txt
pool_mode = transaction
default_pool_size = 8
max_client_conn = 200
admin_users = admin
ignore_startup_parameters = extra_float_digits
; TypeORM/node-pg named prepares survive in transaction mode from 1.21+
max_prepared_statements = 200
