name: marketplace
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      # Bootstrap superuser, used only by rotate.sh to run ALTER ROLE.
      # The application never connects with it. Local-only value.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: marketplace
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Read-only so `docker compose exec db psql -f /db/schema.sql` works on a
      # fresh clone without installing a psql client on the host.
      - ./db:/db:ro
      - marketplace-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d marketplace"]
      interval: 2s
      timeout: 2s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./pgbouncer/start.sh:/start.sh:ro
      - ./secrets:/run/secrets:ro
    entrypoint: ["/bin/sh", "/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U admin -d marketplace"]
      interval: 2s
      timeout: 2s
      retries: 15

  broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker"]
      interval: 2s
      timeout: 2s
      retries: 15

  rabbitmq:
    image: rabbitmq:4.2-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 20s

  # Cache. maxmemory-policy is process-wide, so this box cannot also host the queue.
  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command:
      - redis-server
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  # Queue, sessions, and the rate-limit counter. BullMQ refuses allkeys-lru.
  redis-queue:
    image: redis:8-alpine
    ports:
      - "6380:6379"
    command:
      - redis-server
      - --maxmemory-policy
      - noeviction
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
    volumes:
      - redis-queue:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20

  # S3-compatible store. Garage v2, one node, no replication.
  # --single-node applies the layout; --default-bucket imports the stand key
  # and creates hw26-files. The secret is at least 16 characters because
  # Garage rejects a shorter one. tmpfs so a recreate starts empty, and the
  # data disk is >= 1g so the multipart demo cannot fill it mid-run.
  s3:
    image: dxflrs/garage:v2.5.0
    command:
      - /garage
      - server
      - --single-node
      - --default-bucket
    environment:
      GARAGE_DEFAULT_ACCESS_KEY: hw26user
      GARAGE_DEFAULT_SECRET_KEY: hw26secretpass01
      GARAGE_DEFAULT_BUCKET: hw26-files
    ports:
      - "3900:3900"
    volumes:
      - ./docker/garage.toml:/etc/garage.toml:ro
    tmpfs:
      - /var/lib/garage/meta:size=256m
      - /var/lib/garage/data:size=1g
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  pact-broker:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    ports:
      - "21620:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://broker:broker@broker-db/broker
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
    depends_on:
      broker-db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost may be ::1, puma is IPv4-only
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  marketplace-db:
  redis-queue:
