name: marketplace
services:
  db:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      # Bootstrap superuser, used only by rotate.sh to run ALTER ROLE.
      # The application never connects with it. Local-only value.
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin-bootstrap-only
      POSTGRES_DB: marketplace
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      # Read-only so `docker compose exec db psql -f /db/schema.sql` works on a
      # fresh clone without installing a psql client on the host.
      - ./db:/db:ro
      - marketplace-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d marketplace"]
      interval: 2s
      timeout: 2s
      retries: 15

  pgbouncer:
    image: edoburu/pgbouncer:v1.24.1-p1
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
      - ./pgbouncer/start.sh:/start.sh:ro
      - ./secrets:/run/secrets:ro
    entrypoint: ["/bin/sh", "/start.sh"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U admin -d marketplace"]
      interval: 2s
      timeout: 2s
      retries: 15

  broker-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: broker
      POSTGRES_PASSWORD: broker
      POSTGRES_DB: broker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U broker -d broker"]
      interval: 2s
      timeout: 2s
      retries: 15

  pact-broker:
    image: pactfoundation/pact-broker:2.142.0-pactbroker2.120.0
    ports:
      - "21620:9292"
    environment:
      PACT_BROKER_DATABASE_URL: postgres://broker:broker@broker-db/broker
      PACT_BROKER_ALLOW_PUBLIC_READ: "true"
    depends_on:
      broker-db:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: inside the container localhost may be ::1, puma is IPv4-only
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9292/diagnostic/status/heartbeat"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  marketplace-db:
